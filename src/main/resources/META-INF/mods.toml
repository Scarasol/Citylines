modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Lost Cities is required: Citylines is an addon for its world generation.
# The version floor is the analysed baseline; every mixin target comes from it.
[[dependencies.${mod_id}]]
    modId="lostcities"
    mandatory=true
    versionRange="${lostcities_version_range}"
    ordering="AFTER"
    side="BOTH"

# Optional co-residents. Never required; compatibility is detected at runtime
# through Forge's mod list (no reflection, no hard class references).
[[dependencies.${mod_id}]]
    modId="lc2h"
    mandatory=false
    versionRange="${lc2h_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="extractioncities"
    mandatory=false
    versionRange="[1.0,)"
    ordering="AFTER"
    side="BOTH"
